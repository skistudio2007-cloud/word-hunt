 <h1>Privacy Policy for Word Hunt</h1>
 <div class=\date\>Effective Date: January 1, 2026</div>

 <p>Word Hunt (\we\, \our\, or \app\) is committed to protecting your privacy. This Privacy Policy outlines how our word search mobile game collects, uses, and safeguards information.</p>

 <h2>1. Information Collection and Storage</h2>
 <p>Word Hunt is designed to function seamlessly offline. All game progress, level completions, user preferences, streaks, and achievements are stored locally on your device storage. We do not store personal details (such as your name, email address, or phone number) on external servers.</p>

 <h2>2. Advertising & Analytics</h2>
 <p>Word Hunt integrates Google AdMob to provide rewarded video ads (e.g., unlocking bonus hints) and milestone interstitial ads. Google AdMob may collect and process device identifiers, including the Google Advertising ID (GAID), IP address, and interaction data solely for ad delivery, fraud prevention, and performance metrics in accordance with Google's Privacy Policy.</p>

 <h2>3. Children's Privacy</h2>
 <p>Word Hunt does not knowingly collect personal identifiable information from children under the age of 13. Our gameplay is suitable for players of all ages.</p>

 <h2>4. Data Security</h2>
 <p>All network communications (such as ad requests) utilize industry-standard HTTPS encryption.</p>

 <h2>5. Contact Us</h2>
 <p>If you have any questions or suggestions regarding our Privacy Policy, please contact us via our developer portal on Google Play.</p>
