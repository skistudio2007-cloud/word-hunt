name: Word Hunt - Android Build & GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: true

jobs:
  # 1. Build Android APK & AAB Packages
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web Assets
        run: pnpm build

      - name: Sync Capacitor Android
        run: |
          pnpm cap sync android
          chmod +x android/gradlew

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordHunt-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordHunt-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab

      - name: Prepare Named Release Assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/*.apk release-assets/WordHunt-debug.apk
          cp android/app/build/outputs/bundle/debug/*.aab release-assets/WordHunt-debug.aab

      - name: Create or Update GitHub Release v1.0.21
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.21
          name: "Word Hunt v1.0.21 - Zero-Lag Level Drop & Professional Pop Celebration"
          body: |
            ### 🎮 Word Hunt v1.0.21 - Zero-Lag Level Drop & Professional Pop Celebration

            - 🚀 **Zero-Lag Level Start Drop**:
              - Eliminated the 550ms React state timer (`isInitialDrop`) that was triggering a heavy 64-component re-render midway through tile drop.
              - Tiles now cascade in a fluid diagonal wave (`(rowIndex + colIndex) * 0.024s`) strictly on the GPU compositor with `both` fill mode.
              - 100% buttery-smooth 60/120 FPS when any level or grid starts.
            - 🎉 **Professional Bouncy Pop Celebration**:
              - 24 multi-shape party popper confetti pieces (fluttering ribbons, diamonds, glowing dots) bursting outward on GPU threads.
              - Juicy bouncy card entrance (`scale: [0.65 -> 1.12 -> 0.95 -> 1]`) with dual celestial sunburst rays and golden radiant glow.
              - Ascending 3-star pop celebration with golden ping wave rings and melodic audio chimes.
              - Bouncy NEXT LEVEL action button with tactile spring squash on tap.
            - 📱 **Clean Version Bump**: Updated `versionCode` to 21 and `versionName` to 1.0.21.
          files: |
            release-assets/WordHunt-debug.apk
            release-assets/WordHunt-debug.aab


  # 2. Build & Deploy Web Game to GitHub Pages
  deploy-pages:
    name: Deploy Web Game to GitHub Pages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web App
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
