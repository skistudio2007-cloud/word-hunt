name: Word Hunt - Android Build & GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: true

jobs:
  # 1. Build Android APK & AAB Packages
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web Assets
        run: pnpm build

      - name: Sync Capacitor Android
        run: |
          pnpm cap sync android
          chmod +x android/gradlew

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android Release AAB & APK
        run: |
          cd android
          ./gradlew bundleRelease assembleRelease assembleDebug --no-daemon

      - name: Prepare Named Release Assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/bundle/release/*.aab release-assets/WordHunt-release.aab
          cp android/app/build/outputs/apk/release/*.apk release-assets/WordHunt-release.apk
          cp android/app/build/outputs/apk/debug/*.apk release-assets/WordHunt-debug.apk

      - name: Create or Update GitHub Release v1.0.8
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.8
          name: "Word Hunt v1.0.8 - Google Play Console Signed Production Release"
          body: |
            ### 🎮 Word Hunt v1.0.8 - Google Play Console Ready (Signed Release AAB)

            - 📦 **Production Signed AAB**: `WordHunt-release.aab` signed with release keystore, ready for direct upload to Google Play Developer Console.
            - 📲 **Production Signed APK**: `WordHunt-release.apk` for real-device testing.
            - 💰 **Real Google AdMob Ads**: Official App ID (`ca-app-pub-2007565791914092~7531337749`), Rewarded Ad unit, and Interstitial Ad unit.
            - 🛡️ **Android 13+ Advertising ID Permission**: Added `com.google.android.gms.permission.AD_ID`.
            - 🌊 **Staggered Tile Drop-in Entry**: Grid letters cascade down from top on level start.
            - ✨ **Word Selection & Found Pop Animations**: Active swiped tiles scale up dynamically.
            - 🏆 **Premium Win View Celebration**: Rotating golden sunburst rays, 3D golden trophy badge, 3-star golden ripple waves.
            - 🚀 **Zero-Lag Swiping**: 60-120 FPS buttery-smooth touch dragging.
          files: |
            release-assets/WordHunt-release.aab
            release-assets/WordHunt-release.apk
            release-assets/WordHunt-debug.apk


  # 2. Build & Deploy Web Game to GitHub Pages
  deploy-pages:
    name: Deploy Web Game to GitHub Pages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web App
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
