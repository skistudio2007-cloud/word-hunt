name: Word Hunt - Android Build & GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-and-build"
  cancel-in-progress: true

jobs:
  # 1. Build Android APK & AAB Packages
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web Assets
        run: pnpm build

      - name: Sync Capacitor Android
        run: |
          pnpm cap sync android
          chmod +x android/gradlew

      - name: Setup Android SDK Path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordHunt-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordHunt-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab

      - name: Prepare Named Release Assets
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/*.apk release-assets/WordHunt-debug.apk
          cp android/app/build/outputs/bundle/debug/*.aab release-assets/WordHunt-debug.aab

      - name: Create or Update GitHub Release v1.0.9
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.9
          name: "Word Hunt v1.0.9 - Real Google AdMob Ads & Milestone Triggers"
          body: |
            ### 🎮 Word Hunt v1.0.9 - Real Google AdMob Ads & Milestone Triggers

            - 💰 **Real Google AdMob Ads**: Configured official production App ID (`ca-app-pub-2007565791914092~7531337749`), Rewarded Ad unit (`ca-app-pub-2007565791914092/1828806113`), and Interstitial Ad unit (`ca-app-pub-2007565791914092/4518161594`).
            - 🛡️ **Fail-Safe Ad Serving**: Added fallback to Google official test units if real ad inventory returns No-Fill (Code 3) during Google account review.
            - 🎯 **Earlier Milestone Frequency**: Interstitial ads now trigger starting at Level 2, then every 2 levels (2, 4, 6, 8...).
            - 🌐 **Cleartext & AdMob Flags**: Added `android:usesCleartextTraffic="true"`, `OPTIMIZE_INITIALIZATION`, and `OPTIMIZE_AD_LOADING`.
            - 🔑 **Signed with Verified Keystore**: SHA-256 fingerprint extracted for Play Console / Firebase / AdMob app verification.
            - 📱 **Clean Version Bump**: Updated `versionCode` to 9 and `versionName` to 1.0.9.
          files: |
            release-assets/WordHunt-debug.apk
            release-assets/WordHunt-debug.aab


  # 2. Build & Deploy Web Game to GitHub Pages
  deploy-pages:
    name: Deploy Web Game to GitHub Pages
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Web App
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
